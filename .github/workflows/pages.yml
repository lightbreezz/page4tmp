name: Publish encrypted album
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Prepare allowlisted site files
        run: |
          mkdir -p _site/assets
          cp .nojekyll album.bin app.js config.json index.html style.css _site/
          cp assets/*.bin _site/assets/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4